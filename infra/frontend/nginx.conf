server {
    listen 80;
    server_name _; # Replace with frontend hostname; configure TLS separately.
    root /var/www/culturepick;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    # No API proxy. Browser calls VITE_API_BASE_URL on the backend directly.
}
