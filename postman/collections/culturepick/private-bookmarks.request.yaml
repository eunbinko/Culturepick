$kind: http-request
method: GET
url: '{{base_url}}/bookmarks'
order: 4000
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Private data requires login', () => pm.response.to.have.status(401));
      pm.test('Error contract', () => pm.expect(pm.response.json().detail).to.be.a('string'));
